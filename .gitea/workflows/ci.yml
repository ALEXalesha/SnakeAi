# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи идут на
# раннер ПК (метка windows), а Python - ПК в своём окружении, а не setup-python (тому нужны
# права администратора на реестр). Меняя проверки, править оба файла.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Python в отдельном окружении
        run: |
          py -3.13 -m venv .ci-venv
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$((Resolve-Path .ci-venv).Path)\Scripts`n")

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q
